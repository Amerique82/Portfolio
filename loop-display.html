<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Bucles FOR y WHILE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6f8;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1f2328;
        }

        .container {
            background: white;
            border-radius: 10px;
            border: 1px solid #d0d7de;
            box-shadow: 0 2px 10px rgba(31, 35, 40, 0.08);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #1f2328;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }

        .bucle-section {
            border: 1px solid #d0d7de;
            border-radius: 10px;
            padding: 20px;
            background: #fbfcfe;
        }

        .bucle-section h2 {
            color: #1f2328;
            margin-bottom: 15px;
            font-size: 20px;
            border-bottom: 1px solid #d0d7de;
            padding-bottom: 10px;
        }

        .controls {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d0d7de;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
            background: #fff;
        }

        button {
            background: #1f6feb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            width: 48%;
            margin-right: 2%;
            margin-bottom: 10px;
        }

        button:hover {
            background: #1a5fd0;
        }

        .reset-btn {
            width: 100%;
            margin-right: 0;
            background: #57606a;
        }

        .reset-btn:hover {
            background: #424a53;
        }

        .visualization {
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .iteration {
            background: #f6f8fa;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid #1f6feb;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .iteration.active {
            background: #fff3cd;
            border-left-color: #ffc107;
            font-weight: bold;
        }

        .iteration.completed {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .code-display {
            background: #0b1020;
            color: #e6edf3;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-bottom: 15px;
            overflow-x: auto;
            line-height: 1.6;
        }

        .keyword {
            color: #ff79c6;
        }

        .function {
            color: #8be9fd;
        }

        .number {
            color: #bd93f9;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            font-weight: 500;
            margin-bottom: 10px;
            text-align: center;
        }

        .status.running {
            background: #fff3cd;
            color: #856404;
        }

        .status.completed {
            background: #d4edda;
            color: #155724;
        }

        .status.stopped {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            button {
                width: 100%;
                margin-right: 0;
            }
        }

        .legend {
            margin-top: 20px;
            padding: 15px;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 5px;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Visualizador de Bucles FOR y WHILE</h1>

        <div class="content">
            <!-- Sección FOR -->
            <div class="bucle-section">
                <h2>Bucle FOR</h2>

                <div class="code-display">
<span class="keyword">for</span> (<span class="keyword">let</span> i = <span class="number">0</span>; i &lt; n; i++) {<br>
&nbsp;&nbsp;<span class="function">console</span>.<span class="function">log</span>(i);<br>
}
                </div>

                <div class="controls">
                    <label for="forIteraciones">Número de iteraciones:</label>
                    <input type="number" id="forIteraciones" min="1" max="20" value="5">
                </div>

                <div class="controls">
                    <label for="forVelocidad">Velocidad (ms entre iteraciones):</label>
                    <input type="number" id="forVelocidad" min="100" max="2000" value="500" step="100">
                </div>

                <button onclick="ejecutarBucleFor()">Ejecutar FOR</button>
                <button onclick="resetearFor()" class="reset-btn">Resetear</button>

                <div id="statusFor" class="status" style="display: none;"></div>

                <div class="visualization" id="visualizacionFor"></div>
            </div>

            <!-- Sección WHILE -->
            <div class="bucle-section">
                <h2>Bucle WHILE</h2>

                <div class="code-display">
<span class="keyword">let</span> i = <span class="number">0</span>;<br>
<span class="keyword">while</span> (i &lt; n) {<br>
&nbsp;&nbsp;<span class="function">console</span>.<span class="function">log</span>(i);<br>
&nbsp;&nbsp;i++;<br>
}
                </div>

                <div class="controls">
                    <label for="whileIteraciones">Número de iteraciones:</label>
                    <input type="number" id="whileIteraciones" min="1" max="20" value="5">
                </div>

                <div class="controls">
                    <label for="whileVelocidad">Velocidad (ms entre iteraciones):</label>
                    <input type="number" id="whileVelocidad" min="100" max="2000" value="500" step="100">
                </div>

                <button onclick="ejecutarBucleWhile()">Ejecutar WHILE</button>
                <button onclick="resetearWhile()" class="reset-btn">Resetear</button>

                <div id="statusWhile" class="status" style="display: none;"></div>

                <div class="visualization" id="visualizacionWhile"></div>
            </div>
        </div>

        <!-- Leyenda -->
        <div class="legend">
            <strong>Leyenda de colores:</strong>
            <div class="legend-item">
                <div class="legend-box" style="background: #f6f8fa; border: 2px solid #1f6feb;"></div>
                <span>Iteración pendiente</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #fff3cd; border: 2px solid #ffc107;"></div>
                <span>Iteración en ejecución</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #d4edda; border: 2px solid #28a745;"></div>
                <span>Iteración completada</span>
            </div>
        </div>
    </div>

    <script>
        let forRunning = false;
        let whileRunning = false;

        async function ejecutarBucleFor() {
            if (forRunning) return;

            forRunning = true;
            const iteraciones = parseInt(document.getElementById('forIteraciones').value);
            const velocidad = parseInt(document.getElementById('forVelocidad').value);
            const visualizacion = document.getElementById('visualizacionFor');
            const status = document.getElementById('statusFor');

            visualizacion.innerHTML = '';
            status.style.display = 'block';
            status.className = 'status running';
            status.textContent = 'Ejecutando bucle FOR...';

            // Crear placeholders para todas las iteraciones
            for (let i = 0; i < iteraciones; i++) {
                const elemento = document.createElement('div');
                elemento.className = 'iteration';
                elemento.id = `for-iter-${i}`;
                elemento.innerHTML = `<strong>Iteración ${i}:</strong> i = ${i}`;
                visualizacion.appendChild(elemento);
            }

            // Ejecutar iteraciones
            for (let i = 0; i < iteraciones; i++) {
                await new Promise(resolve => setTimeout(resolve, velocidad));

                const elemento = document.getElementById(`for-iter-${i}`);
                elemento.classList.add('active');

                await new Promise(resolve => setTimeout(resolve, 300));

                elemento.classList.remove('active');
                elemento.classList.add('completed');
            }

            status.className = 'status completed';
            status.textContent = 'Bucle FOR completado';
            forRunning = false;
        }

        async function ejecutarBucleWhile() {
            if (whileRunning) return;

            whileRunning = true;
            const iteraciones = parseInt(document.getElementById('whileIteraciones').value);
            const velocidad = parseInt(document.getElementById('whileVelocidad').value);
            const visualizacion = document.getElementById('visualizacionWhile');
            const status = document.getElementById('statusWhile');

            visualizacion.innerHTML = '';
            status.style.display = 'block';
            status.className = 'status running';
            status.textContent = 'Ejecutando bucle WHILE...';

            // Crear placeholders
            for (let i = 0; i < iteraciones; i++) {
                const elemento = document.createElement('div');
                elemento.className = 'iteration';
                elemento.id = `while-iter-${i}`;
                elemento.innerHTML = `<strong>Iteración ${i}:</strong> i = ${i}, condición (i < ${iteraciones}) = ${i < iteraciones}`;
                visualizacion.appendChild(elemento);
            }

            // Ejecutar iteraciones
            let i = 0;
            while (i < iteraciones) {
                await new Promise(resolve => setTimeout(resolve, velocidad));

                const elemento = document.getElementById(`while-iter-${i}`);
                elemento.classList.add('active');

                await new Promise(resolve => setTimeout(resolve, 300));

                elemento.classList.remove('active');
                elemento.classList.add('completed');
                i++;
            }

            status.className = 'status completed';
            status.textContent = 'Bucle WHILE completado';
            whileRunning = false;
        }

        function resetearFor() {
            document.getElementById('visualizacionFor').innerHTML = '';
            document.getElementById('statusFor').style.display = 'none';
            forRunning = false;
        }

        function resetearWhile() {
            document.getElementById('visualizacionWhile').innerHTML = '';
            document.getElementById('statusWhile').style.display = 'none';
            whileRunning = false;
        }
    </script>
</body>
</html>
